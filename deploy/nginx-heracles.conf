# /etc/nginx/sites-available/heracles  (enlazar en sites-enabled y recargar nginx)
server {
    listen 80;
    server_name escaperoom.example.com;   # cambiar por el dominio o la IP del servidor

    # Para HTTPS: sudo certbot --nginx -d escaperoom.example.com

    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    location /static/ {
        alias /opt/heracles/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
